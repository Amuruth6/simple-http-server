<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple HTTP Server</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 {
      font-size: 3em;
      margin: 0.3em 0;
    }
    p {
      font-size: 1.2em;
    }
    .box {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    footer {
      margin-top: 2em;
      font-size: 0.9em;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🚀 Simple HTTP Server</h1>
    <p>This page is served using my <b>Python Socket HTTP Server</b> project.</p>
    <p>Check out my <a href="https://github.com/Amuruth6/simple-http-server" style="color:#FFD700; text-decoration:none;">GitHub</a> for the code!</p>
  </div>
  <footer>Made with ❤️ using Python</footer>
</body>
</html>
